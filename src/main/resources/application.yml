server:
  # Sem context-path: WebConfig prefixa só os @RestController com /termometro/api, deixando a
  # raiz do domínio livre pra servir o front-end buildado (classpath:/static).
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: termometro
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/termometro}
    username: ${DB_USERNAME:termometro}
    password: ${DB_PASSWORD:termometro}
  jpa:
    open-in-view: false
    hibernate:
      # O Flyway é o dono do schema. 'validate' garante que as entidades e as
      # migrations não divirjam em silêncio — 'update' esconderia a divergência.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: America/Fortaleza
  flyway:
    enabled: true
    locations: classpath:db/migration

# ---------------------------------------------------------------------------
# CORS (fatia 13, RN-11 — dashboard). Lista separada por vírgula de origens
# permitidas para /v1/**. Default é o dev server padrão do Vite.
# ---------------------------------------------------------------------------
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------------
# Bot do Telegram (RN-22 / M6 — notificação matinal).
#
# Opcional: diferente do Pluggy, a ausência das variáveis NÃO impede o app de
# subir. Sem TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID a notificação matinal é
# apenas pulada (log de aviso) até você criar o bot com o @BotFather.
# ---------------------------------------------------------------------------
telegram:
  base-url: https://api.telegram.org
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

logging:
  level:
    br.com.felipe.termometro: DEBUG
